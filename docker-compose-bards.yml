# "Bards + regex" (hybrid) stack: the custom analyzer image plus the stock
# anonymizer. Build locally with `docker compose -f docker-compose-bards.yml build`
# or pull the GHCR images published by .github/workflows/build-bards-hybrid.yml.
services:
  presidio-anonymizer:
    image: ${REGISTRY_NAME:-ghcr.io/mayflower/}presidio-anonymizer${TAG:-:latest}
    build:
      context: ./presidio-anonymizer
    environment:
      - PORT=5001
    ports:
      - "5001:5001"

  presidio-analyzer-bards:
    image: ${REGISTRY_NAME:-ghcr.io/mayflower/}presidio-analyzer-bards${TAG:-:latest}
    build:
      context: ./presidio-analyzer
      dockerfile: Dockerfile.bards
    environment:
      - PORT=5001
      # Override these from the host env / an .env file. Defaults are CPU-safe:
      # one worker, and ORT_INTRA_OP_THREADS left unset so ONNX Runtime picks a
      # thread count itself. For best CPU throughput set ORT_INTRA_OP_THREADS to
      # the container's physical cores and benchmark; keep
      # WORKERS * ORT_INTRA_OP_THREADS at or below those cores so workers and ORT
      # threads don't oversubscribe the CPU. TOKENIZERS_PARALLELISM=false avoids
      # the tokenizers fork/parallelism warning and contention.
      - WORKERS=${WORKERS:-1}
      - ORT_INTRA_OP_THREADS=${ORT_INTRA_OP_THREADS:-}
      - TOKENIZERS_PARALLELISM=false
    ports:
      - "5002:5001"
    # CPU / quantized ONNX default: the four language instances (en/de/fr/it)
    # share one ONNX Runtime session, so the quantized model is loaded once.
    # ~1–1.5 GB working set; the limit below leaves headroom.
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
