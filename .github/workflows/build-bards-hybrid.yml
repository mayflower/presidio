name: Build Bards-hybrid images

# Builds and pushes the "Bards + regex" (hybrid) Presidio stack to GHCR:
#   - presidio-analyzer-bards  (Dockerfile.bards, Bards model baked in)
#   - presidio-anonymizer      (stock image, for a complete pair)
# Auth uses the built-in GITHUB_TOKEN — no extra secrets required.

on:
  push:
    branches:
      - feature/eu-pii-recognizer
    tags:
      - "bards-v*"
    paths:
      - "presidio-analyzer/**"
      - "presidio-anonymizer/**"
      - ".github/workflows/build-bards-hybrid.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: presidio-analyzer-bards
            context: ./presidio-analyzer
            dockerfile: Dockerfile.bards
          - image: presidio-anonymizer
            context: ./presidio-anonymizer
            dockerfile: Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Compute image metadata
        id: meta
        run: |
          set -eu
          owner_lc="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "image=ghcr.io/${owner_lc}/${{ matrix.image }}"
            echo "ref_tag=${GITHUB_REF_NAME//\//-}"
            echo "sha_tag=sha-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        run: |
          set -eu
          IMAGE="${{ steps.meta.outputs.image }}"
          docker buildx build \
            --file "${{ matrix.context }}/${{ matrix.dockerfile }}" \
            --push \
            --tag "${IMAGE}:${{ steps.meta.outputs.ref_tag }}" \
            --tag "${IMAGE}:${{ steps.meta.outputs.sha_tag }}" \
            --tag "${IMAGE}:latest" \
            --cache-from "type=registry,ref=${IMAGE}:buildcache" \
            --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
            "${{ matrix.context }}"

      - name: Summary
        run: |
          {
            echo "### Pushed \`${{ matrix.image }}\`"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:latest\`"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref_tag }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
