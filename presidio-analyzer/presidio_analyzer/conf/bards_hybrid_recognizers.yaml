# Recognizer registry for the "Bards + regex" (hybrid) image — the benchmarked
# optimal setup: deterministic regex/checksum recognizers own the structured
# identifiers, and Bards owns the free-text / contextual PII.
#
# This is the CPU-optimized default: the NER backend is BardsEuPiiOnnxRecognizer,
# which runs the upstream quantized onnx/model_quantized.onnx via Optimum ONNX
# Runtime (no PyTorch model load). To use the PyTorch backend instead, point the
# registry at bards_hybrid_recognizers_pytorch.yaml (e.g. set
# RECOGNIZER_REGISTRY_CONF_FILE, or the Dockerfile.bards BARDS_BACKEND=pytorch
# build arg).
#
# Only the recognizers listed here are loaded (no other predefined recognizers),
# keeping the registry focused on the hybrid layer.
supported_languages:
  - en
  - de
  - fr
  - it
global_regex_flags: 26

recognizers:
  # spaCy NER is disabled — Bards owns PERSON / LOCATION / etc.
  # (spaCy is still loaded for tokenization via bards_hybrid.yaml).
  - name: SpacyRecognizer
    type: predefined
    enabled: false

  # --- Deterministic structured-PII layer (regex / checksum) ---
  - name: EmailRecognizer
    type: predefined
  - name: PhoneRecognizer
    type: predefined
  - name: CreditCardRecognizer
    type: predefined
  - name: IbanRecognizer
    type: predefined
  - name: IpRecognizer
    type: predefined
  - name: UrlRecognizer
    type: predefined

  # --- Bards EU-PII (hybrid), CPU / quantized ONNX Runtime ---
  # Owns free-text NER; runs onnx/model_quantized.onnx on CPU. The structured
  # labels below are dropped so the deterministic recognizers above own e-mail /
  # phone / IP / card / URL. ORT threading can be tuned with the
  # ORT_INTRA_OP_THREADS / ORT_INTER_OP_THREADS env vars (or onnx_provider here).
  - name: BardsEuPiiOnnxRecognizer
    type: predefined
    threshold: 0.4
    onnx_provider: CPUExecutionProvider
    labels_to_ignore:
      - EMAIL_ADDRESS
      - PHONE_NUMBER
      - IP_ADDRESS
      - PAYMENT_CARD
      - IDENTIFYING_LINK
